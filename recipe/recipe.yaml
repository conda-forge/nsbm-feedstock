schema_version: 1

context:
  name: nsbm
  version: "0.7.4"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/fvalle1/trisbm/archive/refs/tags/${{ version }}.tar.gz
  sha256: 667edb55e333576f043f2657f80ba4ec43bac9dda0579f8b6542c6565509244a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - numpy
    - matplotlib-base
    - pandas
    - cloudpickle
    - graph-tool <3

tests:
  - python:
      imports:
        - trisbm
      pip_check: false
      python_version: ${{ python_min }}.*
  - files:
      source:
        - tests
    script:
      - python -c "from nsbm import nsbm; model=nsbm()"
      - python tests/run_tests.py

about:
  license: GPL-3.0-only
  license_file: LICENSE
  summary: nSBM, keyword informed topic modeling
  description: |
    Package to run n-partite Stocastich Block Modeling.
  homepage: https://github.com/BioPhys-Turin/nsbm
  repository: https://github.com/fvalle1/nsbm
  documentation: https://fvalle1.github.io/nsbm/

extra:
  recipe-maintainers:
    - fvalle1
